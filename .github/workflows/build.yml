name: Build Windows and macOS

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', LICENSE]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: windows-x64
            package: npm run dist:win
          - name: macOS Apple Silicon
            os: macos-15
            target: macOS-arm64
            package: npm run dist:mac -- --arm64
          - name: macOS Intel
            os: macos-15-intel
            target: macOS-x64
            package: npm run dist:mac -- --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Electron end-to-end tests
        run: npm run e2e
      - name: Generate platform icons
        run: npm run icon
      - name: Package application
        run: ${{ matrix.package }}
      - name: Verify packaged application
        run: npm run verify
      - name: Upload installers and archives
        uses: actions/upload-artifact@v7
        with:
          name: Typewriter-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
